[build]
  command = "npm run build"
  publish = "dist"

# Revalidate the model periodically; its stable URL is not content-addressed.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Standard security headers for the app shell
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
